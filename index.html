    <script>
      // Gracefully neutralize benign Vite HMR websocket disconnection in AI Studio container environment
      (function() {
        try {
          if (typeof window !== 'undefined' && window.WebSocket) {
            var OrigWS = window.WebSocket;
            function MockWS(url, protocols) {
              var isVite = protocols === 'vite-hmr' || (typeof url === 'string' && (url.indexOf('vite') !== -1 || url.indexOf('hmr') !== -1));
              if (isVite) {
                var bus = new EventTarget();
                bus.binaryType = 'blob';
                bus.readyState = 1;
                bus.bufferedAmount = 0;
                bus.extensions = '';
                bus.protocol = 'vite-hmr';
                bus.url = String(url);
                bus.send = function() {};
                bus.close = function() {};
                bus.onopen = null;
                bus.onclose = null;
                bus.onerror = null;
                bus.onmessage = null;
                setTimeout(function() {
                  var ev = new Event('open');
                  if (typeof bus.onopen === 'function') bus.onopen(ev);
                  bus.dispatchEvent(ev);
                }, 0);
                return bus;
              }
              return new OrigWS(url, protocols);
            }
            MockWS.prototype = OrigWS.prototype;
            MockWS.CONNECTING = 0;
            MockWS.OPEN = 1;
            MockWS.CLOSING = 2;
            MockWS.CLOSED = 3;
            window.WebSocket = MockWS;
          }
        } catch (e) {}

        function isViteLog(arg) {
          if (!arg) return false;
          var s = typeof arg === 'string' ? arg : (arg.message || String(arg));
          return s.indexOf('[vite]') !== -1 || s.indexOf('websocket') !== -1 || s.indexOf('WebSocket') !== -1;
        }

        var origErr = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteLog(arguments[i])) return;
          }
          origErr.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteLog(arguments[i])) return;
          }
          origWarn.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          if (isViteLog(e.message) || isViteLog(e.error)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();

      // Global Dark Theme Default Pre-hydration Loader
      (function() {
        try {
          var storedTheme = localStorage.getItem('gigme_theme_mode') || localStorage.getItem('theme');
          var isDark = true; // GIAO DIỆN TỐI (CYBER DARK) LÀ MẶC ĐỊNH 100%
          if (storedTheme === 'DAYLIGHT' || storedTheme === 'light') {
            isDark = false;
          } else if (storedTheme === 'CYBER_DARK' || storedTheme === 'AMOLED' || storedTheme === 'dark') {
            isDark = true;
          } else {
            // Mặc định luôn ưu tiên Dark Mode chuẩn của GigMe
            isDark = true;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light', 'theme-daylight');
            if (storedTheme === 'AMOLED') {
              document.documentElement.classList.add('theme-amoled');
            } else {
              document.documentElement.classList.add('theme-cyber');
            }
          } else {
            document.documentElement.classList.remove('dark', 'theme-amoled', 'theme-cyber');
            document.documentElement.classList.add('light', 'theme-daylight');
          }
        } catch (e) {}
      })();
    </script>
